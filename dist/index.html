<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Corinthia:wght@400;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Knewave&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>Bruna & Henrique</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>

<body>
    <section class="hero">
        <div class="container-senha">
            <div class="login">
                <h2 class="title">Bem-vindos</h2>
                <p class="text">Digite a senha para acessar os detalhes do evento</p>
                <input type="password" id="password" placeholder="Digite a senha">
                <button class="buttonstyle" onclick="verificarSenha()" id="entrar">Entrar</button>
                <p id="mensagem-erro" class="hidden">Senha incorreta. Tente novamente.</p>
            </div>
        </div>
    </section>

    <script>function verificarSenha() {
    const senhaCorreta = "brunique";
    const inputSenha = document.getElementById("password").value;
    const mensagemErro = document.getElementById("mensagem-erro");
    mensagemErro.classList.add("hidden"); // Oculta a mensagem antes da verificação
    if (inputSenha === senhaCorreta) {
        console.log("Senha correta! Redirecionando...");
        window.location.href = "indexHome.html";
    } else mensagemErro.classList.remove("hidden");
}
// Simula o pressionamento da tecla "Enter"
function simularEnter() {
    const event = new KeyboardEvent("keyup", {
        key: "Enter",
        keyCode: 13,
        which: 13,
        bubbles: true
    });
    document.getElementById("password").dispatchEvent(event);
}
// Executa a verificação ao pressionar Enter
document.getElementById("password").addEventListener("keyup", function(event) {
    if (event.key === "Enter") verificarSenha();
});
// Faz o botão "Entrar" disparar o evento "Enter"
document.getElementById("entrar").addEventListener("click", simularEnter);

</script>
<script src="/casamentoMIN.59712999.js"></script></body>

</html>
