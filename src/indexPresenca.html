</head>

<body>

    <!--======== HEADER ========-->
    <header class="header">
        <div class="header__logo">
            <a class="header__logo-screen" href="index.html">BRUNA & HENRIQUE</a>
            <a class="header__logo-mobile" href="index.html">B&H</a>
        </div>
        <div class="mobileMenu">
            <div class="line1"></div>
            <div class="line2"></div>
            <div class="line3"></div>
        </div>
        <div class="header__menu">
            <ul class="header__menu-link">
                <li class="header__menu-link-item">
                    <i class="ri-home-line"></i>
                    <a class="menuText" href="index.html">Home</a>
                </li>
                <li class="header__menu-link-item">
                    <i class="ri-calendar-schedule-line"></i>
                    <a class="menuText" href="indexCerimonia.html">Cerimônia</a>
                    <a class="menuTextSub" href="indexCerimonia.html">Cerimônia</a>
                    <a class="menuTextSub" href="indexCerimonia.html">Localização</a>
                    <a class="menuTextSub" href="indexCerimonia.html">Recepção</a>
                </li>
                <li class="header__menu-link-item">
                    <i class="ri-book-open-line"></i>
                    <a class="menuText" href="indexHistoria.html">Nossa história</a>
                </li>
                <li class="header__menu-link-item">
                    <i class="ri-shirt-line"></i>
                    <a class="menuText" href="indexDicas.html">Dicas</a>
                    <a class="menuTextSub" href="indexDicas.html">Dress code</a>
                </li>
                <li class="header__menu-link-item">
                    <i class="ri-gift-line"></i>

                </li>
                <li class="header__menu-link-item">
                    <i class="ri-checkbox-line"></i>
                    <a class="menuText" href="indexPresenca.html">Confirme presença</a>
                </li>
            </ul>
        </div>
    </header>

    <div class="content-form">
        <div class="container container-prst">
            <!--=============== ///////////// DICAS ///////////// ===============-->
            <section class="paginaDicas">
                <p class="title content__title">Confirme sua presença</p>
                <form class="form" method="post" action="" name="contact-form">
                    <div class="form__campo">
                        <label for="nome">Nome completo:</label>
                        <input type="text" name="your-name" class="form__campo-same text" placeholder="Seu nome completo" required>
                    </div>
                    <div class="form__campo">
                        <label for="presenca">Você irá ao evento?</label><br>
                        <input type="radio" id="sim" name="presenca" value="Sim" class="sim-nao">
                        <label for="sim">Sim</label>
                        <input type="radio" id="nao" name="presenca" value="Não" class="sim-nao">
                        <label for="nao">Não</label>
                    </div>
                    <div class="form__campo">
                        <label for="obs">Observações:</label>
                        <textarea id="obs" name="obs" class="form__campo-same text"></textarea>
                    </div>
                    <button type="submit" class="buttonstyle text">Confirmar presença</button>
                    <div class="loader" style="display: none;">Enviando...</div>
                </form>
            </section>
        </div>
    </div>
    <script src="/src/scripts/main.js"></script>
</body>
